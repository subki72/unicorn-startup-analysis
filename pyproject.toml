[project]
name = "unicorn-startup-analysis"
version = "1.0.0"
description = "Modular SQLite3 ETL, analytical engine, and FastAPI microservice for unicorn startup analytics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "Faker>=30.8.2",
    "fastapi>=0.115.6",
    "httpx>=0.28.1",
    "matplotlib>=3.9.2",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "flake8>=7.1.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "."]
extend-exclude = ["*.ipynb", ".venv", "venv", "artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["unicorn_analytics"]
force-sort-within-sections = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
